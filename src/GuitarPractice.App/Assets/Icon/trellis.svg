<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Trellis app icon (48 px and up): a sprout growing up a rosewood fretboard. Hand-tuned on a 256 grid.
       Rosewood #4A3324, nut #EDE3CF, frets #B9AE9C, strings #D9C8A8, stem/leaves #6FAE68, bud #F2B33D. -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#4A3324"/>
  <!-- strings (the middle two are left out so the sprout reads clearly) -->
  <g stroke="#D9C8A8" stroke-width="2.6">
    <line x1="60" y1="68" x2="60" y2="228"/>
    <line x1="87" y1="68" x2="87" y2="228"/>
    <line x1="169" y1="68" x2="169" y2="228"/>
    <line x1="196" y1="68" x2="196" y2="228"/>
  </g>
  <!-- frets -->
  <g stroke="#B9AE9C" stroke-width="4.5">
    <line x1="52" y1="114" x2="204" y2="114"/>
    <line x1="52" y1="157" x2="204" y2="157"/>
    <line x1="52" y1="196" x2="204" y2="196"/>
  </g>
  <!-- nut -->
  <line x1="52" y1="68" x2="204" y2="68" stroke="#EDE3CF" stroke-width="11" stroke-linecap="round"/>
  <!-- sprout -->
  <line x1="128" y1="228" x2="128" y2="62" stroke="#6FAE68" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="110" cy="184" rx="18" ry="9" transform="rotate(-35 110 184)" fill="#6FAE68"/>
  <ellipse cx="146" cy="140" rx="18" ry="9" transform="rotate(35 146 140)" fill="#6FAE68"/>
  <ellipse cx="110" cy="98" rx="18" ry="9" transform="rotate(-35 110 98)" fill="#6FAE68"/>
  <circle cx="128" cy="48" r="10" fill="#F2B33D"/>
</svg>
